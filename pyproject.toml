[project]
name = "asagent"
version = "0.0.8"
requires-python = ">=3.13,<3.14"
dependencies = [
    "aiosqlite>=0.20,<1",
    "alembic>=1.18,<2",
    "fastapi>=0.115,<1",
    "httpx>=0.28,<0.29",
    "jsonschema>=4.26,<5",
    "keyring>=25,<26",
    "numpy>=2.0,<3",
    "onnxruntime>=1.20,<2",
    "playwright>=1.49,<2",
    "pydantic>=2,<3",
    "pypdf>=6.16,<7",
    "qdrant-client>=1.13,<2",
    "send2trash>=2.1.0",
    "sqlalchemy[asyncio]>=2.0,<2.1",
    "tokenizers>=0.21,<1",
    "uvicorn>=0.30,<1",
]

[project.scripts]
asagent = "asagent.cli:main"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.3.0",
    "pyinstaller>=6,<7",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.1",
    "types-jsonschema>=4.26,<5",
    "types-send2trash>=2.1.0.20260408",
]

[tool.pytest.ini_options]
minversion = "9.0"
testpaths = ["tests"]
addopts = "-ra --strict-config --strict-markers"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
asyncio_default_test_loop_scope = "function"

[tool.ruff]
target-version = "py313"
line-length = 88
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]
files = ["src", "tests"]
pretty = true
show_error_codes = true
warn_unreachable = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true
